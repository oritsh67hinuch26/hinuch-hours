<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2B4BAA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>חינוך ישראלי — דיווח שעות</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Assistant', 'Segoe UI', Tahoma, sans-serif; background: #f3f5fa; color: #1a1a1a; direction: rtl; min-height: 100vh; }
    .app { max-width: 480px; margin: 0 auto; padding-bottom: 80px; }
    .header { background: #2B4BAA; min-height: 72px; color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .header-title { font-size: 17px; font-weight: 600; }
    .header-sub { font-size: 12px; opacity: .8; margin-top: 2px; }
    .header-user { background: rgba(255,255,255,.2); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; cursor: pointer; border: none; color: #fff; }
    .tabs { display: flex; background: #fff; border-bottom: 1px solid #e5e5e5; position: sticky; top: 72px; z-index: 9; }
    .tab { flex: 1; min-height: 48px; padding: 11px 6px; text-align: center; font-size: 15px; color: #4a5470; cursor: pointer; border-bottom: 2px solid transparent; transition: .2s; white-space: nowrap; border: none; background: none; font-family: inherit; }
    .tab.active { color: #2B4BAA; border-bottom: 3px solid #2B4BAA; font-weight: 700; }
    .content { padding: 16px; }
    .card { background: #fff; border-radius: 12px; border: 1px solid #eee; padding: 16px; margin-bottom: 12px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; color: #1a1a1a; font-family: inherit; direction: rtl; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2B4BAA; box-shadow: 0 0 0 3px rgba(43,75,170,.15); }
    textarea { resize: none; height: 60px; margin-top: 8px; }
    .btn { width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: .15s; font-family: inherit; }
    .btn-primary { background: #2B4BAA; color: #fff; }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { background: #9aaad4; cursor: default; }
    .btn-ghost { background: transparent; border: 1px solid #ddd; color: #333; margin-top: 8px; }
    .entry-item { padding: 12px 0; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: flex-start; }
    .entry-item:last-child { border-bottom: none; }
    .entry-main { flex: 1; }
    .entry-school { font-size: 14px; font-weight: 500; }
    .entry-act { font-size: 13px; color: #666; margin-top: 2px; }
    .entry-date { font-size: 12px; color: #999; margin-top: 2px; }
    .pill { background: #e8ecf8; color: #1a3080; border-radius: 20px; padding: 3px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat { background: #f8f8f8; border-radius: 8px; padding: 12px; text-align: center; }
    .stat-val { font-size: 22px; font-weight: 500; color: #2B4BAA; }
    .stat-label { font-size: 12px; color: #888; margin-top: 2px; }
    .empty { text-align: center; padding: 40px 20px; color: #999; font-size: 14px; }
    .login-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; }
    .login-logo { width: 64px; height: 64px; background: #2B4BAA; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 20px; }
    .login-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .login-sub { font-size: 14px; color: #888; margin-bottom: 28px; }
    .name-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 340px; }
    .name-btn { padding: 14px 20px; border: 1px solid #e0e0e0; border-radius: 10px; background: #fff; font-size: 15px; cursor: pointer; text-align: right; font-family: inherit; transition: .15s; }
    .name-btn:hover { border-color: #2B4BAA; background: #eef1fa; color: #2B4BAA; }
    .delete-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 4px; }
    .delete-btn:hover { color: #e55; }
    .summary-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .summary-row:last-child { border-bottom: none; }
    .summary-name { font-size: 14px; font-weight: 500; }
    .bar-wrap { height: 4px; background: #f0f0f0; border-radius: 4px; margin-top: 5px; overflow: hidden; width: 140px; }
    .bar-fill { height: 100%; background: #2B4BAA; border-radius: 4px; }
    .bar-fill-b { background: #2952b3; }
    .summary-hours { font-size: 15px; font-weight: 600; color: #2B4BAA; text-align: left; }
    .summary-amount { font-size: 11px; color: #999; margin-top: 1px; text-align: left; }
    .grand-total { background: #2B4BAA; color: #fff; border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .gt-label { font-size: 13px; opacity: .85; }
    .gt-val { font-size: 18px; font-weight: 600; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .filter-row select { flex: 1; font-size: 13px; padding: 8px 10px; }
    .total-bar { background: #2B4BAA; color: #fff; border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-hdr { font-size: 12px; font-weight: 500; color: #999; display: flex; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid #eee; margin-bottom: 4px; }
    .admin-entry { padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .admin-entry:last-child { border-bottom: none; }
    .price-hint { background: #e8ecf8; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; color: #1a3080; }
    .saved-msg { text-align: center; padding: 40px 20px; }
    .spinner { text-align: center; padding: 30px; color: #999; font-size: 14px; }
    .month-sel { width: 100%; margin-bottom: 14px; }
    .error-msg { background: #fff0f0; border: 1px solid #ffcccc; border-radius: 8px; padding: 12px; font-size: 13px; color: #c00; margin-bottom: 12px; }
    .hdr-who { display: flex; align-items: center; gap: 10px; }
    .hdr-name { display: flex; flex-direction: column; line-height: 1.2; }
    .hdr-hello { font-size: 13px; opacity: .85; }
    .hdr-user { font-size: 18px; font-weight: 700; }
    .hdr-switch { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; font: inherit; font-size: 15px; cursor: pointer; }
    .sec-title { font-size: 15px; font-weight: 700; color: #4a5470; margin-bottom: 8px; display: block; }
    .chip-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
    .chip-row.four { grid-template-columns: repeat(4, minmax(0,1fr)); margin-top: 8px; }
    .choice { min-height: 48px; border-radius: 12px; border: 1px solid #cfd6e6; background: #fff; color: #17203a; font: inherit; font-size: 16px; cursor: pointer; }
    .choice.on { border: 2px solid #2B4BAA; background: #2B4BAA; color: #fff; font-weight: 700; }
    .stepper { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #cfd6e6; border-radius: 14px; padding: 8px; }
    .step-btn { width: 52px; height: 52px; border-radius: 12px; border: 0; background: #e9edf8; color: #2B4BAA; font: inherit; font-size: 26px; font-weight: 700; cursor: pointer; }
    .step-val { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .step-unit { font-size: 16px; color: #4a5470; margin-right: 6px; }
    .date-line { margin-top: 8px; font-size: 16px; font-weight: 600; color: #2B4BAA; }
    .mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .mini-stat { background: #fff; border: 1px solid #e3e7f0; border-radius: 14px; padding: 12px 14px; }
    .mini-label { font-size: 14px; color: #4a5470; }
    .mini-val { font-size: 26px; font-weight: 700; color: #2B4BAA; }
    .month-hdr { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 8px; }
    .month-name { font-size: 17px; font-weight: 700; }
    .month-total { font-size: 15px; color: #4a5470; }
    .del-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid #e3e7f0; background: #fff; color: #8a2a2a; cursor: pointer; display: grid; place-items: center; }
  </style>
</head>
<body>
<div id="root"></div>

<script>
// ====================================================
// ⚡ הכנס כאן את כתובת ה-Apps Script שלך
// ====================================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJe1M-ZnlYE_Ws-wzvUsEUw9ZX3lWqTNJpElzWmWEYFr4qFMd9jf34nAvWNw-XQFkd/exec";
// ====================================================

const INSTRUCTORS = ["אורית שטרית","מעיין זך","ענת דימנט","אמונה לנדאו","שרון שפירא","גליה דהן","ערן סעד"];
const SCHOOLS = ["יחדיו","שבילי רעות","רמת כרמים","סלעית","שדות","עלי זהב","חטיבה א","חטיבה ב","שש שנתי","אגף חינוך באר טוביה","ייעוץ לחינוך ישראלי"];
const ACTIVITIES = ["יום הדרכה","פגישות עבודה","אחר"];
const RATE = 440;
const TABS = ["+ דיווח", "הדיווחים שלי", "ריכוז"];

// סל שעות שנתי לכל גוף, נספר מ-1/9
const SCHOOL_BUDGET = {
  "יחדיו":               120,
  "שבילי רעות":          180,
  "רמת כרמים":           130,
  "סלעית":               120,
  "שדות":                250,
  "עלי זהב":             100,
  "חטיבה א":             300,
  "חטיבה ב":             300,
  "שש שנתי":             130,
  "אגף חינוך באר טוביה": 250
};

// סל שעות שנתי לכל מנחה (null = ללא סל)
const HOUR_BUDGET = {
  "מעיין זך":    180,
  "ענת דימנט":   180,
  "גליה דהן":    120,
  "ערן סעד":     40,
  "שרון שפירא":  150,
  "אמונה לנדאו": 50,
  "אורית שטרית": null
};

function schoolYearOf(dateStr) {
  const d = new Date(dateStr);
  const y = d.getFullYear(), m = d.getMonth() + 1;
  return m >= 9 ? y : y - 1;
}
function currentSchoolYear() { return schoolYearOf(new Date().toISOString().split("T")[0]); }
function isCurrentSchoolYear(dateStr) {
  // שנת הלימודים והסל נספרים מ-1 בספטמבר
  const d = new Date(dateStr);
  if (d < new Date("2026-09-01")) return false;
  return schoolYearOf(dateStr) === currentSchoolYear();
}

function localISO(d) {
  const x = d || new Date();
  return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0");
}
function daysAgoISO(n) { const d = new Date(); d.setDate(d.getDate()-n); return localISO(d); }
function hebDayLabel(iso) {
  if (!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  const days = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  let rel = "";
  if (iso === localISO()) rel = " (היום)";
  else if (iso === daysAgoISO(1)) rel = " (אתמול)";
  return "יום " + days[dt.getDay()] + ", " + d + "/" + m + "/" + y + rel;
}
function setFormDate(v) { formState.date = v; render(); }

function fmtDate(d) {
  if (!d) return "";
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(d);
  return `${m[3]}/${m[2]}`;
}
function monthLabel(d) { return ["","ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"][parseInt(d.split("-")[1])]; }

// API calls
async function apiGet() {
  const res = await fetch(SCRIPT_URL);
  const data = await res.json();
  // הסרת כפילויות לפי מזהה (אם אותו דיווח נשמר פעמיים)
  const seen = new Set();
  return (data.entries || []).filter(e => !seen.has(String(e.id)) && seen.add(String(e.id)));
}
async function apiSave(entry) {
  const url = SCRIPT_URL + "?action=save&id=" + encodeURIComponent(entry.id)
    + "&instructor=" + encodeURIComponent(entry.instructor)
    + "&date=" + encodeURIComponent(entry.date)
    + "&school=" + encodeURIComponent(entry.school)
    + "&activity=" + encodeURIComponent(entry.activity)
    + "&hours=" + encodeURIComponent(entry.hours)
    + "&ts=" + encodeURIComponent(entry.ts);
  const res = await fetch(url);
  return await res.json();
}
async function apiDelete(id, instructor, school) {
  const url = SCRIPT_URL + "?action=delete&id=" + encodeURIComponent(id) + "&instructor=" + encodeURIComponent(instructor) + "&school=" + encodeURIComponent(school);
  const res = await fetch(url);
  return await res.json();
}

// ---- STATE ----
let state = { user: null, tab: 0, entries: [], loading: false, error: null, adminUnlocked: false, loginSelected: null, loginError: null };
let formState = { date: "", school: "", hours: "" };
let saved = false;

function render() {
  const root = document.getElementById("root");
  if (!state.user) { root.innerHTML = loginHTML(); return; }
  root.innerHTML = `
    <div class="app">
      <div class="header">
        <div class="hdr-who">
          <img src="icon.png" alt="חינוך ישראלי" style="height:40px;width:40px;border-radius:10px;background:#fff;object-fit:contain">
          <div class="hdr-name"><span class="hdr-hello">שלום,</span><span class="hdr-user">${state.user}</span></div>
        </div>
        <button class="hdr-switch" onclick="logout()">החלפה</button>
      </div>
      <div class="tabs">${(state.user==="אורית שטרית"?["+ דיווח","הדיווחים שלי","ריכוז"]:["+ דיווח","הדיווחים שלי"]).map((t,i)=>`<button class="tab${state.tab===i?" active":""}" onclick="setTab(${i})">${t}</button>`).join("")}</div>
      <div class="content">${tabContent()}</div>
    </div>`;
  attachEvents();
}

function loginHTML() {
  const sel = state.loginSelected;
  const err = state.loginError;
  const logo = `<div class="login-logo" style="background:transparent;width:auto;height:auto;border-radius:0"><img src="icon.png" style="height:60px;object-fit:contain"></div>`;
  if (!sel) {
    return `<div class="login-wrap">
      ${logo}
      <div class="login-title">חינוך ישראלי</div>
      <div class="login-sub">מי את/ה?</div>
      <div class="name-grid">
        ${INSTRUCTORS.map(n=>`<button class="name-btn" onclick="selectUser('${n}')">${n}</button>`).join("")}
      </div>
    </div>`;
  } else {
    return `<div class="login-wrap">
      ${logo}
      <div class="login-title">${sel}</div>
      <div class="login-sub">הזיני סיסמה</div>
      <div style="width:100%;max-width:340px">
        <div class="form-group">
          <input type="password" id="login-pass" onkeydown="if(event.key==='Enter')tryLogin()" placeholder="סיסמה..." style="text-align:center;font-size:20px;letter-spacing:4px${err?';border-color:#e55':''}">
        </div>
        ${err?`<div style="color:#e55;font-size:13px;text-align:center;margin-bottom:12px">${err}</div>`:''}
        <button class="btn btn-primary" onclick="tryLogin()">כניסה</button>
        <button class="btn btn-ghost" onclick="backToNames()">חזרה</button>
      </div>
    </div>`;
  }
}

function tabContent() {
  if (state.tab === 0) return addEntryHTML();
  if (state.tab === 1) return myEntriesHTML();
  if (state.tab === 2 && state.user==="אורית שטרית") return summaryHTML();
  return addEntryHTML();
}


// ===== הנחיה להתקנה באייפון =====
function iosInstallBannerHTML() {
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const installed = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  let dismissed = false;
  try { dismissed = localStorage.getItem("iosBannerDismissed") === "1"; } catch(_) {}
  if (!isIOS || installed || dismissed) return "";
  const inSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|GSA|FBAN|FBAV|Instagram|Line/.test(ua);
  const steps = inSafari
    ? `1. לוחצים על כפתור השיתוף <b>⬆️</b> (בתחתית המסך)<br>2. גוללים ובוחרים <b>"הוספה למסך הבית"</b><br>3. לוחצים <b>"הוסף"</b>`
    : `הקישור נפתח מתוך אפליקציה אחרת (וואטסאפ / ג׳ימייל וכד׳).<br>1. לוחצים על <b>⋯</b> או על סמל המצפן ובוחרים <b>"פתח בספארי"</b><br>2. בספארי: כפתור השיתוף <b>⬆️</b> ← <b>"הוספה למסך הבית"</b>`;
  return `<div class="card" style="background:#FFF8E1;border:1px solid #F5C451;margin-bottom:12px;font-size:14px;line-height:1.7">
    <div style="font-weight:700;margin-bottom:4px">📲 להוסיף את האפליקציה למסך הבית</div>
    ${steps}
    <div style="text-align:left;margin-top:6px"><button onclick="dismissIosBanner()" style="background:none;border:none;color:#888;font-size:13px;cursor:pointer;font-family:inherit">לא עכשיו ✕</button></div>
  </div>`;
}
function dismissIosBanner() { try { localStorage.setItem("iosBannerDismissed","1"); } catch(_) {} render(); }

function addEntryHTML() {
  if (saved) return `<div class="card saved-msg"><div style="font-size:40px;margin-bottom:12px;color:#2B4BAA">✓</div><div style="font-size:18px;font-weight:700;color:#2B4BAA">נשמר בהצלחה!</div></div>`;
  const f = formState;
  const canSave = f.date && f.date <= localISO() && f.school && f.hours;
  const today = localISO(), yest = daysAgoISO(1);
  const other = f.dateOther || (f.date && f.date !== today && f.date !== yest);
  const hrs = parseFloat(f.hours) || 0;
  return iosInstallBannerHTML() + `<div class="card">
    <div class="form-group"><span class="sec-title">מתי התקיימה הפעילות?</span>
      <div class="chip-row">
        <button type="button" class="choice${f.date===today&&!other?" on":""}" onclick="formState.dateOther=false;setFormDate(localISO())">היום</button>
        <button type="button" class="choice${f.date===yest&&!other?" on":""}" onclick="formState.dateOther=false;setFormDate(daysAgoISO(1))">אתמול</button>
        <button type="button" class="choice${other?" on":""}" onclick="formState.dateOther=true;if(formState.date===localISO()||formState.date===daysAgoISO(1))formState.date='';render()">תאריך אחר</button>
      </div>
      ${other?`<input type="date" id="f-date" value="${f.date}" max="${today}" style="margin-top:8px">`:""}
      ${f.date
        ? `<div class="date-line">${hebDayLabel(f.date)}</div>`
        : `<div style="margin-top:8px;font-size:14px;color:#a0352b">בוחרים את התאריך שבו הפעילות התקיימה, לא את תאריך הדיווח</div>`}
    </div>
    <div class="form-group"><label for="f-school" class="sec-title">גוף</label>
      <select id="f-school" style="min-height:48px;font-size:16px">
        <option value="">בחירת גוף...</option>
        ${SCHOOLS.map(s=>`<option value="${s}"${f.school===s?" selected":""}>${s}</option>`).join("")}
      </select>
    </div>
    <div class="form-group"><span class="sec-title">כמה שעות?</span>
      <div class="stepper">
        <button type="button" class="step-btn" aria-label="פחות חצי שעה" onclick="stepHours(-0.5)">−</button>
        <div><span class="step-val">${hrs||"–"}</span><span class="step-unit">שעות</span></div>
        <button type="button" class="step-btn" aria-label="עוד חצי שעה" onclick="stepHours(0.5)">+</button>
      </div>
      <div class="chip-row four">
        ${[2,4,6,8].map(n=>`<button type="button" class="choice${hrs===n?" on":""}" onclick="formState.hours='${n}';render()">${n}</button>`).join("")}
      </div>
    </div>
    <button class="btn btn-primary" style="min-height:54px;font-size:18px" onclick="submitEntry()" ${!canSave?"disabled":""}>שמירת הדיווח</button>
  </div>`;
}
function stepHours(d) {
  const cur = parseFloat(formState.hours) || 0;
  const next = Math.min(8, Math.max(0.5, cur + d));
  formState.hours = String(next); render();
}

function myEntriesHTML() {
  const mine = state.entries.filter(e => e.instructor === state.user).sort((a,b)=>String(b.date).localeCompare(String(a.date)) || b.ts-a.ts);
  if (state.loading) return `<div class="spinner">טוען...</div>`;
  if (!mine.length) return `<div class="empty">אין דיווחים עדיין</div>`;

  const budget = HOUR_BUDGET[state.user];
  const yearHours = mine.filter(e=>isCurrentSchoolYear(e.date)).reduce((s,e)=>s+parseFloat(e.hours),0);
  const thisMonth = localISO().substring(0,7);
  const monthHours = mine.filter(e=>String(e.date).startsWith(thisMonth)).reduce((s,e)=>s+parseFloat(e.hours),0);
  const syLabel = `סל תשפ"ז`;

  let statsHTML = `<div class="mini-stats"${budget?"":' style="grid-template-columns:1fr"'}>
      <div class="mini-stat"><div class="mini-label">החודש</div><div class="mini-val">${monthHours} ש׳</div></div>
      ${budget?`<div class="mini-stat"><div class="mini-label">נשארו בסל</div><div class="mini-val" style="color:${yearHours>budget?'#a0352b':'#17203a'}">${budget-yearHours} ש׳</div></div>`:""}
    </div>`;
  if (budget) {
    const pct = Math.min(Math.round(yearHours / budget * 100), 100);
    const remaining = budget - yearHours;
    const overBudget = yearHours > budget;
    const barColor = overBudget ? "#a0352b" : pct >= 85 ? "#c26a12" : "#2B4BAA";
    statsHTML += `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px">
        <b>סל שעות ${syLabel}</b>
        <span style="color:#4a5470">${yearHours} מתוך ${budget}</span>
      </div>
      <div style="height:10px;background:#e9edf8;border-radius:6px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${barColor};border-radius:6px;transition:.3s"></div>
      </div>
      ${overBudget ? `<div style="font-size:14px;color:#a0352b;margin-top:6px">עברת את הסל ב־${Math.abs(remaining)} שעות</div>`
        : pct >= 85 ? `<div style="font-size:14px;color:#c26a12;margin-top:6px">נשארו רק ${remaining} שעות מהסל</div>` : ""}
    </div>`;
  }

  const groups = {};
  mine.forEach(e => { const k = String(e.date).substring(0,7); (groups[k] = groups[k] || []).push(e); });
  const days = ["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
  const dayOf = iso => { const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ""; return "יום " + days[new Date(+m[1], +m[2]-1, +m[3]).getDay()] + " "; };
  const listHTML = Object.keys(groups).sort().reverse().map(k => {
    const list = groups[k];
    const tot = list.reduce((s,e)=>s+parseFloat(e.hours),0);
    return `<div style="margin-bottom:14px">
      <div class="month-hdr"><span class="month-name">${monthLabel(k+"-01")} ${k.substring(0,4)}</span><span class="month-total">${tot} שעות</span></div>
      <div class="card" style="padding:0 14px;margin-bottom:0">${list.map(e=>`
        <div class="entry-item" style="align-items:center">
          <div class="entry-main">
            <div class="entry-school" style="font-size:16px;font-weight:700">${e.school}</div>
            <div class="entry-date" style="font-size:14px;color:#4a5470">${dayOf(e.date)}${fmtDate(e.date)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="pill" style="font-size:15px;padding:4px 12px">${e.hours} ש׳</span>
            <button class="del-btn" aria-label="מחיקת הדיווח" onclick="deleteEntry('${e.id}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
          </div>
        </div>`).join("")}
      </div></div>`;
  }).join("");

  return statsHTML + listHTML;
}

function summaryHTML() {
  const entries = state.entries;
  if (state.loading) return `<div class="spinner">טוען...</div>`;
  if (!entries.length) return `<div class="empty">אין דיווחים עדיין</div>`;

  const months = [...new Set(entries.map(e=>e.date.substring(0,7)))].sort().reverse();
  const fm = state.filterMonth || "";
  const filtered = fm ? entries.filter(e=>e.date.startsWith(fm)) : entries.filter(e=>isCurrentSchoolYear(e.date));
  const total = filtered.reduce((s,e)=>s+parseFloat(e.hours),0);

  const byInst = {}; INSTRUCTORS.forEach(i=>{byInst[i]=0;}); filtered.forEach(e=>{if(byInst[e.instructor]!==undefined)byInst[e.instructor]+=parseFloat(e.hours);});
  const maxInst = Math.max(...Object.values(byInst),1);

  // שעות שנת לימודים לכל מנחה (לצורך סל)
  const yearByInst = {};
  INSTRUCTORS.forEach(i=>{ yearByInst[i] = state.entries.filter(e=>e.instructor===i && isCurrentSchoolYear(e.date)).reduce((s,e)=>s+parseFloat(e.hours),0); });
  const sy = currentSchoolYear();
  const syLabel = `סל תשפ"ז`;

  const bySchool = {}; filtered.forEach(e=>{bySchool[e.school]=(bySchool[e.school]||0)+parseFloat(e.hours);});
  const schoolList = Object.entries(bySchool).sort((a,b)=>b[1]-a[1]);
  const maxSchool = Math.max(...schoolList.map(x=>x[1]),1);

  return `
    <select class="month-sel" onchange="setFilterMonth(this.value)">
      <option value="">מתחילת השנה (1/9)</option>
      ${months.map(m=>`<option value="${m}"${fm===m?" selected":""}>${monthLabel(m+"-01")} ${m.substring(0,4)}</option>`).join("")}
    </select>
    <div class="grand-total">
      <span class="gt-label">סה"כ שעות</span>
      <span class="gt-val">${total} שעות</span>
    </div>
    <div class="card">
      <div class="section-hdr"><span>לפי מנחה — ${syLabel}, מ-1/9</span><span>שעות</span></div>
      ${INSTRUCTORS.map(inst=>{
        const h = byInst[inst]||0;
        const yh = yearByInst[inst]||0;
        const budget = HOUR_BUDGET[inst];
        if (budget) {
          const pct = Math.min(Math.round(yh/budget*100),100);
          const over = yh > budget;
          const warn = pct >= 85 && !over;
          const barColor = over ? "#c00000" : warn ? "#e67e22" : "#2B4BAA";
          const remaining = budget - yh;
          return `<div class="summary-row" style="flex-direction:column;align-items:stretch;gap:4px;padding:10px 0">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div class="summary-name">${inst}</div>
              <div style="font-size:13px;font-weight:700;color:${barColor}">${yh} / ${budget} ש'</div>
            </div>
            <div style="height:8px;background:#f0f0f0;border-radius:6px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${barColor};border-radius:6px;transition:.3s"></div>
            </div>
            <div style="font-size:11px;color:${over?'#c00000':warn?'#e67e22':'#999'}">
              ${over ? `⚠️ חריגה של ${Math.abs(remaining)} שעות` : warn ? `⚠️ נשארו ${remaining} שעות בלבד` : `נשארו ${remaining} שעות`}
            </div>
          </div>`;
        } else {
          return `<div class="summary-row">
            <div style="flex:1;min-width:0">
              <div class="summary-name">${inst}</div>
              <div style="font-size:11px;color:#999">ללא סל מוגדר</div>
            </div>
            <div style="min-width:80px;text-align:left">
              <div class="summary-hours">${h}ש'</div>
              
            </div>
          </div>`;
        }
      }).join("")}
    </div>
    <div class="card">
      <div class="section-hdr"><span>לפי גוף — ${syLabel}, מ-1/9</span><span>שעות</span></div>
      ${(()=>{
        const names=[...new Set([...Object.keys(SCHOOL_BUDGET), ...schoolList.map(x=>x[0])])];
        const yearBySchool={}; names.forEach(n=>{ yearBySchool[n]=state.entries.filter(e=>e.school===n && isCurrentSchoolYear(e.date)).reduce((t,e)=>t+parseFloat(e.hours),0); });
        return names.map(n=>{
          const h=bySchool[n]||0, yh=yearBySchool[n], b=SCHOOL_BUDGET[n];
          if (!b) return `<div class="summary-row"><div style="flex:1;min-width:0"><div class="summary-name">${n}</div><div style="font-size:13px;color:#4a5470">ללא סל מוגדר</div></div><div class="summary-hours">${h} ש׳</div></div>`;
          const pct=Math.min(Math.round(yh/b*100),100), over=yh>b, warn=pct>=85&&!over;
          const color=over?"#a0352b":warn?"#c26a12":"#2B4BAA";
          return `<div class="summary-row" style="flex-direction:column;align-items:stretch;gap:4px;padding:10px 0">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <div class="summary-name">${n}${fm?` <span style="font-weight:400;color:#4a5470">· ${h} ש׳ בחודש</span>`:""}</div>
              <div style="font-size:14px;font-weight:700;color:${color};white-space:nowrap">${yh} / ${b} ש׳</div>
            </div>
            <div style="height:8px;background:#e9edf8;border-radius:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${color};border-radius:6px"></div></div>
            <div style="font-size:13px;color:${over||warn?color:'#4a5470'}">${over?`חריגה של ${yh-b} שעות`:`נשארו ${b-yh} שעות`}</div>
          </div>`;
        }).join("");
      })()}
    </div>`;
}

// ---- ACTIONS ----
function checkAdminPass() {
  const val = document.getElementById('admin-pass').value;
  if (val === '1967') { state.adminUnlocked = true; render(); }
  else { document.getElementById('admin-pass').style.borderColor='#e55'; document.getElementById('admin-pass').value=''; }
}
function selectUser(name) {
  if (name === "אורית שטרית") {
    state.user = name;
    state.loginSelected = null;
    state.adminUnlocked = true;
    loadEntries();
    render();
    return;
  }
  state.loginSelected = name;
  state.loginError = null;
  render();
  setTimeout(() => { const el = document.getElementById('login-pass'); if(el) el.focus(); }, 50);
}
function backToNames() {
  state.loginSelected = null;
  state.loginError = null;
  render();
}
function tryLogin() {
  const passwords = {"מעיין זך":"001","ענת דימנט":"002","אמונה לנדאו":"003","שרון שפירא":"004","גליה דהן":"005","ערן סעד":"006"};
  const val = document.getElementById('login-pass') ? document.getElementById('login-pass').value : '';
  if (val === passwords[state.loginSelected]) {
    state.loginError = null;
    state.user = state.loginSelected;
    state.loginSelected = null;
    loadEntries();
    render();
  } else {
    state.loginError = "סיסמה שגויה. נסי שוב.";
    render();
    setTimeout(() => { const el = document.getElementById('login-pass'); if(el) { el.focus(); el.select(); } }, 50);
  }
}
function login(name) { state.user = name; loadEntries(); render(); }
function logout() { state.user = null; state.tab = 0; state.loginSelected = null; state.loginError = null; render(); }
function setTab(i) { state.tab = i; render(); }
function setFilterMonth(v) { state.filterMonth = v; render(); }
function setFilterMonthAdmin(v) { state.filterMonth = v; render(); }
function setFilterSchool(v) { state.filterSchool = v; render(); }

function attachEvents() {
  ["f-date","f-school","f-act","f-free","f-hours"].forEach(id=>{
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("change", e=>{
      if(id==="f-date") formState.date=e.target.value;
      if(id==="f-school") formState.school=e.target.value;
      if(id==="f-act") { formState.actType=e.target.value; render(); }
      if(id==="f-free") formState.actFree=e.target.value;
      if(id==="f-hours") formState.hours=e.target.value;
      if(id!=="f-act") render();
    });
    el.addEventListener("input", e=>{
      if(id==="f-hours") { formState.hours=e.target.value; render(); }
      if(id==="f-free") formState.actFree=e.target.value;
    });
  });
}

async function submitEntry() {
  const f = formState;
  const actLabel = "ליווי";
  const newHours = parseFloat(f.hours);
  if (!f.date || f.date > localISO()) { alert("יש לבחור תאריך תקין (לא עתידי)"); return; }
  // בדיקת דיווח כפול (אותו מנחה, אותו יום, אותו גוף)
  const sameDay = state.entries.filter(e => e.instructor === state.user && e.date === f.date && e.school === f.school);
  if (sameDay.length) {
    const list = sameDay.map(e => `• ${e.hours} שעות`).join("\n");
    if (!confirm(`⚠️ כבר קיים דיווח ל${f.school} ב־${hebDayLabel(f.date)}:\n${list}\n\nייתכן שהדיווח כבר נשמר. לשמור דיווח נוסף בכל זאת?`)) return;
  }
  if (!confirm(`לאשר את הדיווח?\n\n📅 ${hebDayLabel(f.date)}\n🏫 ${f.school}\n⏱ ${newHours} שעות`)) return;

  // בדיקת סל שעות
  const budget = HOUR_BUDGET[state.user];
  if (budget) {
    const yearHours = state.entries
      .filter(e => e.instructor === state.user && isCurrentSchoolYear(e.date))
      .reduce((s,e) => s + parseFloat(e.hours), 0);
    const afterSave = yearHours + newHours;
    if (afterSave > budget) {
      const over = afterSave - budget;
      if (!confirm(`⚠️ שמירה זו תעביר אותך מעל הסל!\nשנת הלימודים: ${yearHours} + ${newHours} = ${afterSave} שעות (סל: ${budget})\nתחרגי ב־${over} שעות.\n\nלהמשיך בכל זאת?`)) return;
    } else if (afterSave / budget >= 0.85) {
      alert(`⚠️ שימי לב — לאחר שמירה זו נשארו לך רק ${budget - afterSave} שעות מתוך הסל השנתי.`);
    }
  }

  const entry = { id: Date.now(), instructor: state.user, date: f.date, school: f.school, activity: actLabel, hours: newHours, ts: Date.now() };
  saved = true; render();
  try {
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000));
    // הדיווח נכנס לרשימה מיד, כדי שלא ייראה כאילו "נעלם" ויוזן שוב
    state.entries.push(entry);
    window._pendingOps = (window._pendingOps || 0) + 1;
    const savePromise = apiSave(entry);
    // התשובה מהשרת נבדקת גם אם הגיעה אחרי 8 שניות
    savePromise.then(r => {
      if (!r || !r.success) {
        state.entries = state.entries.filter(e => String(e.id) !== String(entry.id));
        render();
        alert("⚠️ הדיווח לא נשמר!\n" + entry.school + " · " + fmtDate(entry.date) + " · " + entry.hours + " שעות\n\nשגיאה: " + ((r && r.error) || "לא ידועה") + "\n(גרסת שרת: " + ((r && r.version) || "ישנה") + ")\n\nאפשר לצלם את ההודעה הזו ולשלוח לאורית.");
      }
    }).catch(err => console.error("apiSave failed:", err))
      .finally(() => { window._pendingOps--; });
    await Promise.race([savePromise, timeout]);
  } catch (err) {
    console.error("apiSave failed:", err);
  } finally {
    // רענון מהשרת אחרי שהשמירה הסתיימה בוודאות, כדי שהרשימה תשקף את מה שנשמר באמת
    clearTimeout(window._refreshT);
    window._refreshT = setTimeout(refreshEntriesQuietly, 20000);
    // תמיד לאפס את הטופס - גם אם השמירה נכשלה/נתקעה - כדי שאפשר יהיה
    // להמשיך ולהזין דיווח לגוף הבא ברצף בלי לסגור את האפליקציה
    formState = { date: "", school: "", hours: "" };
    setTimeout(()=>{ saved=false; render(); }, 1500);
  }
}

async function deleteEntry(id) {
  const entry = state.entries.find(e=>String(e.id)===String(id));
  if (!entry) return;
  if (!confirm("למחוק את הדיווח?\n" + entry.school + " · " + fmtDate(entry.date) + " · " + entry.hours + " שעות")) return;
  state.entries = state.entries.filter(e=>String(e.id)!==String(id));
  render();
  let ok = false, r = null;
  window._pendingOps = (window._pendingOps || 0) + 1;
  try {
    r = await apiDelete(id, entry.instructor, entry.school);
    ok = !!(r && r.success && r.deleted > 0);
  } catch(_) {}
  window._pendingOps--;
  if (!ok) {
    alert("⚠️ המחיקה לא נקלטה בשרת, והדיווח עדיין קיים.\nהרשימה תיטען מחדש. אפשר לנסות שוב בעוד רגע.\n\nשגיאה: " + ((r && r.error) || "לא ידועה") + "\n(גרסת שרת: " + ((r && r.version) || "ישנה") + ")");
    await refreshEntriesQuietly();
    return;
  }
  // רענון מהשרת אחרי המחיקות, כדי לראות אם משהו לא נמחק באמת
  clearTimeout(window._refreshT);
  window._refreshT = setTimeout(refreshEntriesQuietly, 20000);
}

async function refreshEntriesQuietly() {
  // לא לטעון מחדש בזמן שמחיקות עדיין בדרך לשרת, אחרת דיווחים "יחזרו" זמנית
  if ((window._pendingOps || 0) > 0) { clearTimeout(window._refreshT); window._refreshT = setTimeout(refreshEntriesQuietly, 5000); return; }
  try { state.entries = await apiGet(); render(); } catch(_) {}
}

async function loadEntries() {
  state.loading = true; render();
  try {
    state.entries = await apiGet();
  } catch(e) {
    state.error = "שגיאה בטעינת נתונים";
  }
  state.loading = false; render();
}

render();
</script>
